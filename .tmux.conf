# =============================================================================
# TMUX Configuration with Vim-style Navigation
# =============================================================================

# Optional, change prefix
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

set -sg escape-time 0

# Enable mouse support (useful for pane resizing, page scrolling)
# Also means you need to hold shift to highlight text with mouse
# note: prefix+[ enters text copy mode, then Enter to copy
set -g mouse on

# =============================================================================
# PANE NAVIGATION - ^ + arrows
# =============================================================================
# h/l changed to Left/Right to keep ^h/l for vim tabs
# Disable "Move left/right a space" in System Settings > Keyboard > Keyboard Shortcuts > Mission Control
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R

# k/j changed to Up/Down to avoid clash with C-k in readline
# Disable 'Mission Control' and 'Application Windows' in settings > keyboard shortcuts
bind -n C-Up    select-pane -D
bind -n C-Down  select-pane -U

# # Alternative: cycle through panes with Ctrl+Space
# bind -n C-Space select-pane -t :.+


# # Set inactive pane style (dimmer text/background)
# set -g window-style 'fg=default,bg=colour238'
# # Set active pane style (brighter/default)
# set -g window-active-style 'fg=default,bg=colour235'

# Active pane
set -g window-active-style 'fg=default,bg=#1a1b26'
# Inactive pane
# set -g window-style 'fg=default,bg=#1e1f2a'
set -g window-style 'fg=default,bg=#24283b'

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# =============================================================================
# PANE SPLITTING - Quick shortcuts
# =============================================================================
bind v split-window -h -c "#{pane_current_path}"    # prefix v for vertical split
bind - split-window -v -c "#{pane_current_path}"    # prefix - for horizontal split
bind c new-window -c "#{pane_current_path}"         # prefix c for new window

# =============================================================================
# WINDOW NAVIGATION - Alt+number keys (no prefix)
# =============================================================================
# bind -n M-1 select-window -t 1
# bind -n M-2 select-window -t 2
# bind -n M-3 select-window -t 3
# bind -n M-4 select-window -t 4
# bind -n M-5 select-window -t 5
# bind -n M-6 select-window -t 6
# bind -n M-7 select-window -t 7
# bind -n M-8 select-window -t 8
# bind -n M-9 select-window -t 9

# ctrl + page up/down for next/previous window
bind-key -n C-PPage previous-window
bind-key -n C-NPage next-window

# =============================================================================
# PANE RESIZING - Alt+arrow keys (no prefix)
# =============================================================================
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
# bind = next-layout    # prefix then = (default is prefix + space)

# =============================================================================
# OTHER USEFUL KEYBINDS
# =============================================================================
bind -n M-z resize-pane -Z                          # Alt+z to zoom/unzoom pane
bind -n M-x kill-pane                               # Alt+x to close pane
bind d detach-client                                # prefix+d to detach

# =============================================================================
# VIM-TMUX-NAVIGATOR SETUP
# =============================================================================
# This allows Ctrl+hjkl to work seamlessly across both tmux panes and Vim splits.
# 
# Installation:
#   1. In tmux: git clone https://github.com/christoomey/vim-tmux-navigator ~/.tmux/plugins/vim-tmux-navigator
#   2. In NeoVim: Add this to your init.vim or init.lua:
#        Plug 'christoomey/vim-tmux-navigator'  (if using vim-plug)
#      or
#        use 'christoomey/vim-tmux-navigator'   (if using packer)
#   3. Reload tmux config: tmux source-file ~/.tmux.conf

# is_vim="ps aux | grep -v grep | grep -E 'nvim|vim' | awk '{print \$2}' | xargs -I {} sh -c 'ps -p {} -o comm=' | grep -qE 'nvim|vim'"
# bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
# bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
# bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
# bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
set -g history-limit 10000
set -g base-index 1                                 # Start window numbers at 1
setw -g pane-base-index 1                           # Start pane numbers at 1
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# =============================================================================
# STATUS BAR (optional customization)
# =============================================================================
set -g status-bg "#1e1e1e"
set -g status-fg "#ffffff"
set -g status-left " [#S] "
set -g status-right " %H:%M %a %d-%b "
set -g window-status-current-style "bg=#0099ff,fg=#ffffff"

# =============================================================================
# COPY MODE SETTINGS (Vim motions & Kitty fixes)
# =============================================================================
# Enable vi-style keys in copy mode (h, j, k, l, etc.)
# use V to copy whole line, Space (not v) to select part of line, then Enter to copy
setw -g mode-keys vi

# Ensure arrow keys and colors work correctly with Kitty
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:RGB'
