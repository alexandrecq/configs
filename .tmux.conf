# bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
set -g history-limit 10000
set -g base-index 1                                 # Start window numbers at 1
setw -g pane-base-index 1                           # Start pane numbers at 1
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# =============================================================================
# STATUS BAR (optional customization)
# =============================================================================
set -g status-bg "#1e1e1e"
set -g status-fg "#ffffff"
set -g status-left " [#S] "
set -g status-right " %H:%M %a %d-%b "
set -g window-status-current-style "bg=#0099ff,fg=#ffffff"

# =============================================================================
# COPY MODE SETTINGS (Vim motions & Kitty fixes)
# =============================================================================
# Enable vi-style keys in copy mode (h, j, k, l, etc.)
setw -g mode-keys vi

# Ensure arrow keys and colors work correctly with Kitty
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:RGB'
