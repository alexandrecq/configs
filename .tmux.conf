# =============================================================================
# TMUX Configuration with Vim-style Navigation
# =============================================================================

# Set prefix to Ctrl+a (optional, but many prefer this)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix
set -sg escape-time 0


# Enable mouse support (useful for pane resizing, page scrolling)
# Also means you need to hold shift to highlight text with mouse
# note: prefix+[ enters text copy mode, then Enter to copy
set -g mouse on

# =============================================================================
# PANE NAVIGATION - Vim-style with Ctrl+hjkl (no prefix needed)
# =============================================================================
bind -n C-h select-pane -L
bind -n C-l select-pane -R
# k/j changed to Up/Down to avoid clash with C-k in readline
# Disable 'Mission Control' and 'Application Windows' in settings > keyboard shortcuts
bind -n C-Up    select-pane -D
bind -n C-Down  select-pane -U

# # Alternative: cycle through panes with Ctrl+Space
# bind -n C-Space select-pane -t :.+

# =============================================================================
# PANE SPLITTING - Quick shortcuts
# =============================================================================
bind v split-window -h -c "#{pane_current_path}"    # Ctrl+a v for vertical split
bind - split-window -v -c "#{pane_current_path}"    # Ctrl+a - for horizontal split
bind c new-window -c "#{pane_current_path}"         # Ctrl+a c for new window

# =============================================================================
# WINDOW NAVIGATION - Alt+number keys (no prefix)
# =============================================================================
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ctrl + page up/down for next/previous window
bind-key -n C-PPage previous-window
bind-key -n C-NPage next-window

# =============================================================================
# PANE RESIZING - Alt+arrow keys (no prefix)
# =============================================================================
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
# bind = next-layout    # Ctrl+a then =

# =============================================================================
# OTHER USEFUL KEYBINDS
# =============================================================================
bind -n M-z resize-pane -Z                          # Alt+z to zoom/unzoom pane
bind -n M-x kill-pane                               # Alt+x to close pane
bind d detach-client                                # prefix+d to detach

# =============================================================================
# VIM-TMUX-NAVIGATOR SETUP
# =============================================================================
# This allows Ctrl+hjkl to work seamlessly across both tmux panes and Vim splits.
# 
# Installation:
#   1. In tmux: git clone https://github.com/christoomey/vim-tmux-navigator ~/.tmux/plugins/vim-tmux-navigator
#   2. In NeoVim: Add this to your init.vim or init.lua:
#        Plug 'christoomey/vim-tmux-navigator'  (if using vim-plug)
#      or
#        use 'christoomey/vim-tmux-navigator'   (if using packer)
#   3. Reload tmux config: tmux source-file ~/.tmux.conf

